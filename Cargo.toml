[package]
name = "circular-replay-api-usage"
version = "0.1.0"
edition = "2024"
description = "Client, hydration, and LiteSVM replay for the Circular Pro replay API (/v2/replay)"
license = "MIT OR Apache-2.0"

[lib]
name = "circular_replay"
path = "src/lib.rs"

[[example]]
name = "fetch_replay"
path = "examples/fetch_replay.rs"

[[example]]
name = "compare_rpc"
path = "examples/compare_rpc.rs"

[[example]]
name = "status"
path = "examples/status.rs"

[[example]]
name = "replay_from_api"
path = "examples/replay_from_api.rs"

[[example]]
name = "replay_from_file"
path = "examples/replay_from_file.rs"

[[example]]
name = "replay_slot"
path = "examples/replay_slot.rs"

[[example]]
name = "slot_entries"
path = "examples/slot_entries.rs"

[dependencies]
anyhow = "1"
agave-feature-set = "4.3.2"
base64 = "0.22"
bincode = "1.3.3"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
litesvm = { version = "0.18", features = ["precompiles"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = "4"
solana-address-lookup-table-interface = { version = "3.2", features = ["bincode", "bytemuck"] }
solana-client = { version = "4", features = ["agave-unstable-api"] }
solana-commitment-config = "3"
solana-loader-v3-interface = { version = "8", features = ["serde"] }
solana-sdk = "4"
solana-sdk-ids = "3.1.0"
solana-transaction-status-client-types = { version = "4", features = ["agave-unstable-api"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wincode-v1 = { package = "wincode", version = "0.6", features = ["derive", "alloc"] }
